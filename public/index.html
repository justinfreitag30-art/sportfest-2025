<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sportfest 2026</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#003399">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sportfest 2026">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <h1>⚽ Sportfest 2026</h1>
    <div class="date" id="current-date"></div>
    <div class="live-indicator" id="live-indicator" style="display:none;">
      <span class="live-dot"></span>
      LIVE
    </div>
  </header>

  <div class="push-banner" id="push-banner" style="display:none;">
    <span class="push-banner-text">🔔 Push-Benachrichtigungen bei Spielstart?</span>
    <button class="btn btn-red btn-small" id="btn-enable-push">Aktivieren</button>
    <button class="push-dismiss" id="btn-dismiss-push" aria-label="Schließen">×</button>
  </div>

  <main class="container">
    <div class="sport-view-switch" id="sport-view-switch">
      <button type="button" class="sport-view-btn active" data-sport="Fußball">⚽ Fußball</button>
      <button type="button" class="sport-view-btn" data-sport="Volleyball">🏐 Volleyball</button>
    </div>

    <div class="match-list" id="match-list"></div>

    <section class="leaderboard-section" id="leaderboard-section">
      <h2 class="leaderboard-title" id="leaderboard-title">🏆 ENDSTAND</h2>
      <div id="leaderboard"></div>
    </section>

    <div class="footer" id="last-updated">Zuletzt aktualisiert: —</div>
  </main>

  <div class="push-toggle-bar" id="push-toggle-bar" style="display:none;">
    <label class="push-toggle-label" for="push-toggle-checkbox">
      <input type="checkbox" id="push-toggle-checkbox" aria-describedby="push-toggle-hint">
      <span class="push-toggle-text">
        <strong id="push-toggle-title">🔔 Benachrichtigungen</strong>
        <small id="push-toggle-hint">Einmal aktivieren — Benachrichtigungen kommen auch wenn die Seite geschlossen ist</small>
      </span>
    </label>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let data = { settings: { gameDurationMinutes: 10, standingsSport: 'Fußball' }, teams: [], matches: [] };
    const expandedPenaltyLogs = {};
    let publicTimerInterval = null;
    let selectedSport = localStorage.getItem('sportfest-view-sport') || 'Fußball';

    const SPORT_EMOJIS = {
      'Fußball': '⚽',
      'Volleyball': '🏐'
    };

    const PENALTY_TYPES = {
      yellow:  { emoji: '🟨' },
      red:     { emoji: '🟥' },
      yellow2: { emoji: '🟨🟥' },
      foul:    { emoji: '⚠️' },
      timeout: { emoji: '⏸️' },
      warning: { emoji: '🔔' },
      disqual: { emoji: '❌' }
    };

    function isMobile() {
      return window.innerWidth <= 600;
    }

    function getTeamName(id) {
      const team = data.teams.find(t => t.id === id);
      return team ? team.name : 'Unbekannt';
    }

    function getPlayerName(playerId) {
      if (!playerId) return '';
      for (const team of data.teams) {
        const p = (team.players || []).find(pl => pl.id === playerId);
        if (p) return (p.number ? '#' + p.number + ' ' : '') + p.name;
      }
      return '';
    }

    function formatTime(time) {
      return time + ' Uhr';
    }

    function statusBadge(status) {
      switch (status) {
        case 'running':
          return '<span class="badge badge-running">Läuft <span class="badge-dot">●</span></span>';
        case 'finished':
          return '<span class="badge badge-finished">Beendet</span>';
        default:
          return '<span class="badge badge-pending">Wartet</span>';
      }
    }

    function getMatchDurationMinutes(match) {
      return Math.min(120, Math.max(1, Number(match?.durationMinutes) || data.settings?.gameDurationMinutes || 10));
    }

    function getRemainingSeconds(match) {
      if (!match.startedAt || match.status !== 'running') return null;
      const durationMs = getMatchDurationMinutes(match) * 60 * 1000;
      const elapsed = Date.now() - new Date(match.startedAt).getTime();
      return Math.max(0, Math.floor((durationMs - elapsed) / 1000));
    }

    function formatCountdown(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function countTeamPenalties(match, teamSide) {
      const penalties = match.penalties || [];
      let yellow = 0;
      let red = 0;
      penalties.filter(p => p.team === teamSide).forEach(p => {
        if (p.type === 'yellow') yellow++;
        if (p.type === 'red' || p.type === 'yellow2' || p.type === 'disqual') red++;
      });
      return { yellow, red };
    }

    function penaltyBadges(match) {
      const a = countTeamPenalties(match, 'A');
      const b = countTeamPenalties(match, 'B');
      let badgesA = '';
      let badgesB = '';
      if (a.yellow > 0) badgesA += ` <span class="card-penalty-badge">🟨×${a.yellow}</span>`;
      if (a.red > 0) badgesA += ` <span class="card-penalty-badge">🟥×${a.red}</span>`;
      if (b.yellow > 0) badgesB += ` <span class="card-penalty-badge">🟨×${b.yellow}</span>`;
      if (b.red > 0) badgesB += ` <span class="card-penalty-badge">🟥×${b.red}</span>`;
      return { badgesA, badgesB, hasRed: a.red > 0 || b.red > 0 };
    }

    function penaltyRowClass(type) {
      if (type === 'yellow') return 'penalty-row-yellow';
      if (type === 'red' || type === 'yellow2' || type === 'disqual') return 'penalty-row-red';
      return '';
    }

    function renderPointHistory(match) {
      const goals = match.goals || [];
      if (goals.length === 0) return '';

      const isVolleyball = match.sport === 'Volleyball';
      const emoji = isVolleyball ? '🏐' : '⚽';
      const title = isVolleyball ? 'Punkteverlauf' : 'Tore';

      const rows = goals.map((g, i) => {
        const playerName = g.playerId ? getPlayerName(g.playerId) : (isVolleyball ? 'Punkt ' + (i + 1) : 'Tor');
        const minuteStr = g.minute ? `<span class="goal-minute">${g.minute}'</span> ` : '';
        const chip = `<div class="point-chip">${minuteStr}${emoji} ${escapeHtml(playerName)}</div>`;

        if (g.team === 'A') {
          return `<div class="point-event-row"><div class="point-side point-side-a">${chip}</div><div class="point-side point-side-b"></div></div>`;
        }
        return `<div class="point-event-row"><div class="point-side point-side-a"></div><div class="point-side point-side-b">${chip}</div></div>`;
      }).join('');

      return `
        <div class="point-history">
          <div class="point-history-title">${title}</div>
          ${rows}
        </div>
      `;
    }

    function renderPenaltyLog(match) {
      const penalties = match.penalties || [];
      if (penalties.length === 0) return '';

      const isExpanded = expandedPenaltyLogs[match.id] === true;
      const toggleLabel = isExpanded
        ? `▲ ${penalties.length} Strafen ausblenden`
        : `▼ ${penalties.length} Strafe${penalties.length > 1 ? 'n' : ''} anzeigen`;

      const rows = penalties.map(p => {
        const teamName = p.team === 'A' ? getTeamName(match.teamA) : getTeamName(match.teamB);
        const emoji = (PENALTY_TYPES[p.type] || { emoji: '⚠️' }).emoji;
        const minuteStr = p.minute ? `<span class="penalty-minute">${p.minute}'</span>` : '';
        const playerName = p.playerId ? getPlayerName(p.playerId) : '';
        const playerStr = playerName ? ` <span class="penalty-player">(${escapeHtml(playerName)})</span>` : '';
        const note = p.customNote
          ? `<div class="penalty-note">"${escapeHtml(p.customNote)}"</div>` : '';
        return `
          <div class="penalty-row ${penaltyRowClass(p.type)}">
            <div class="penalty-row-main">
              ${minuteStr}
              <span class="penalty-emoji">${emoji}</span>
              <span class="penalty-team">${escapeHtml(teamName)}${playerStr}</span>
              <span class="penalty-reason">— ${escapeHtml(p.reason)}</span>
            </div>
            ${note}
          </div>
        `;
      }).join('');

      return `
        <div class="penalty-log">
          <button type="button" class="penalty-toggle" data-match-id="${match.id}">${toggleLabel}</button>
          <div class="penalty-log-content ${isExpanded ? '' : 'penalty-log-collapsed'}">
            <div class="penalty-log-header">⚠️ Strafen &amp; Karten</div>
            ${rows}
          </div>
        </div>
      `;
    }

    function renderMatchTimer(match) {
      if (match.status !== 'running' || !match.startedAt) return '';
      const remaining = getRemainingSeconds(match);
      if (remaining === null) return '';
      if (remaining === 0) {
        return '<div class="match-timer timer-expired-pulse">⏱ ABGELAUFEN</div>';
      }
      return `<div class="match-timer" data-match-id="${match.id}">⏱ ${formatCountdown(remaining)} verbleibend</div>`;
    }

    function renderMatches() {
      const list = document.getElementById('match-list');
      const liveIndicator = document.getElementById('live-indicator');

      document.querySelectorAll('.sport-view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sport === selectedSport);
      });

      const sorted = [...data.matches]
        .filter(m => m.sport === selectedSport)
        .sort((a, b) => a.time.localeCompare(b.time));
      const hasLive = sorted.some(m => m.status === 'running');
      liveIndicator.style.display = hasLive ? 'inline-flex' : 'none';

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty-state">Noch keine ${escapeHtml(selectedSport)}-Spiele geplant.</div>`;
        return;
      }

      list.innerHTML = sorted.map(match => {
        const pb = penaltyBadges(match);
        const cardClass = 'match-card' + (pb.hasRed ? ' match-card-red-border' : '');
        const showPoints = (match.goals || []).length > 0 && (match.status === 'running' || match.status === 'finished');

        return `
          <div class="${cardClass}" data-match-id="${match.id}">
            <div class="match-card-top">
              <div class="match-card-meta">
                <span class="match-time">${formatTime(match.time)}</span>
                ${statusBadge(match.status)}
              </div>
            </div>
            <div class="match-score-block">
              <div class="match-score-layout">
                <div class="team-column team-column-left">
                  <div class="team-name">${escapeHtml(getTeamName(match.teamA))}${pb.badgesA}</div>
                </div>
                <div class="match-score-center">
                  <span class="score">${match.scoreA}</span>
                  <span class="score-separator">:</span>
                  <span class="score">${match.scoreB}</span>
                </div>
                <div class="team-column team-column-right">
                  <div class="team-name">${escapeHtml(getTeamName(match.teamB))}${pb.badgesB}</div>
                </div>
              </div>
              ${showPoints ? renderPointHistory(match) : ''}
            </div>
            ${renderMatchTimer(match)}
            ${renderPenaltyLog(match)}
          </div>
        `;
      }).join('');

      document.querySelectorAll('.penalty-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.matchId;
          expandedPenaltyLogs[id] = !expandedPenaltyLogs[id];
          renderMatches();
        });
      });
    }

    function calculateStandings(sport) {
      const stats = {};
      data.teams.forEach(t => {
        stats[t.id] = {
          teamId: t.id,
          name: t.name,
          wins: 0,
          draws: 0,
          losses: 0,
          played: 0,
          goalsFor: 0,
          goalsAgainst: 0,
          points: 0,
          yellowCards: 0,
          redCards: 0
        };
      });

      const sportMatches = data.matches.filter(m => m.status === 'finished' && m.sport === sport);

      sportMatches.forEach(match => {
        const a = stats[match.teamA];
        const b = stats[match.teamB];
        if (!a || !b) return;

        a.played++;
        b.played++;
        a.goalsFor += match.scoreA;
        a.goalsAgainst += match.scoreB;
        b.goalsFor += match.scoreB;
        b.goalsAgainst += match.scoreA;

        if (match.scoreA > match.scoreB) {
          a.wins++;
          b.losses++;
          a.points += 3;
        } else if (match.scoreB > match.scoreA) {
          b.wins++;
          a.losses++;
          b.points += 3;
        } else {
          a.draws++;
          b.draws++;
          a.points += 1;
          b.points += 1;
        }
      });

      data.matches.filter(m => m.sport === sport).forEach(match => {
        (match.penalties || []).forEach(p => {
          const teamId = p.team === 'A' ? match.teamA : match.teamB;
          if (!stats[teamId]) return;
          if (p.type === 'yellow') stats[teamId].yellowCards++;
          if (p.type === 'red' || p.type === 'yellow2' || p.type === 'disqual') stats[teamId].redCards++;
        });
      });

      return Object.values(stats)
        .filter(s => sportMatches.some(m => m.teamA === s.teamId || m.teamB === s.teamId))
        .map(s => ({
          ...s,
          goalDiff: s.goalsFor - s.goalsAgainst
        }))
        .sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          if (b.goalDiff !== a.goalDiff) return b.goalDiff - a.goalDiff;
          if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
          return a.redCards - b.redCards;
        });
    }

    function placeMedal(rank) {
      if (rank === 1) return '🥇';
      if (rank === 2) return '🥈';
      if (rank === 3) return '🥉';
      return rank;
    }

    function placeClass(rank) {
      if (rank === 1) return 'place-1';
      if (rank === 2) return 'place-2';
      if (rank === 3) return 'place-3';
      return '';
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard');
      const sport = selectedSport;
      const emoji = SPORT_EMOJIS[sport] || '';

      document.getElementById('leaderboard-title').textContent = `🏆 ENDSTAND ${emoji} ${sport}`.trim();

      const standings = calculateStandings(sport);

      if (standings.length === 0) {
        container.innerHTML = `<div class="empty-state">Noch keine beendeten ${sport}-Spiele.</div>`;
        return;
      }

      if (isMobile()) {
        const top3 = standings.slice(0, 3);
        const rest = standings.slice(3);

        const podiumHtml = `
          <div class="podium-mobile">
            ${top3[0] ? `
              <div class="podium-card ${placeClass(1)}">
                <div class="podium-rank">🥇 Platz 1</div>
                <div class="podium-team">${escapeHtml(top3[0].name)}</div>
                <div class="podium-stats">
                  <span>${top3[0].wins} S</span>
                  <span>${top3[0].points} Pkt</span>
                  <span class="fair-play">🟨 ${top3[0].yellowCards} 🟥 ${top3[0].redCards}</span>
                </div>
              </div>
            ` : ''}
            <div class="podium-row-23">
              ${top3[1] ? `
                <div class="podium-card ${placeClass(2)}">
                  <div class="podium-rank">🥈 2</div>
                  <div class="podium-team">${escapeHtml(top3[1].name)}</div>
                  <div class="podium-stats">
                    <span>${top3[1].wins} S · ${top3[1].points} Pkt</span>
                    <span class="fair-play">🟨 ${top3[1].yellowCards} 🟥 ${top3[1].redCards}</span>
                  </div>
                </div>
              ` : ''}
              ${top3[2] ? `
                <div class="podium-card ${placeClass(3)}">
                  <div class="podium-rank">🥉 3</div>
                  <div class="podium-team">${escapeHtml(top3[2].name)}</div>
                  <div class="podium-stats">
                    <span>${top3[2].wins} S · ${top3[2].points} Pkt</span>
                    <span class="fair-play">🟨 ${top3[2].yellowCards} 🟥 ${top3[2].redCards}</span>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;

        const restHtml = rest.length > 0 ? `
          <div class="leaderboard-rest">
            ${rest.map((s, i) => `
              <div class="leaderboard-rest-row">
                <span class="rest-rank">${i + 4}</span>
                <span class="rest-team">${escapeHtml(s.name)}</span>
                <span class="rest-stat">${s.wins} S</span>
                <span class="rest-stat">${s.points} Pkt</span>
                <span class="rest-fair">🟨 ${s.yellowCards} 🟥 ${s.redCards}</span>
              </div>
            `).join('')}
          </div>
        ` : '';

        container.innerHTML = podiumHtml + restHtml;
      } else {
        container.innerHTML = `
          <div class="leaderboard-table-wrap">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>Platz</th>
                  <th>Team</th>
                  <th>S</th>
                  <th>P</th>
                  <th class="col-td">TD</th>
                  <th>Pkt</th>
                  <th>Fair Play</th>
                </tr>
              </thead>
              <tbody>
                ${standings.map((s, i) => {
                  const rank = i + 1;
                  return `
                    <tr class="${placeClass(rank)}">
                      <td>${placeMedal(rank)} ${rank}</td>
                      <td class="lb-team-name">${escapeHtml(s.name)}</td>
                      <td>${s.wins}</td>
                      <td>${s.played}</td>
                      <td class="col-td">${s.goalDiff >= 0 ? '+' + s.goalDiff : s.goalDiff}</td>
                      <td class="lb-points">${s.points}</td>
                      <td class="fair-play">🟨 ${s.yellowCards} &nbsp; 🟥 ${s.redCards}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    function updatePublicTimers() {
      document.querySelectorAll('.match-timer[data-match-id]').forEach(el => {
        const match = data.matches.find(m => m.id === el.dataset.matchId);
        if (!match) return;
        const remaining = getRemainingSeconds(match);
        if (remaining === null) return;
        if (remaining === 0) {
          el.textContent = '⏱ ABGELAUFEN';
          el.classList.add('timer-expired-pulse');
        } else {
          el.textContent = '⏱ ' + formatCountdown(remaining) + ' verbleibend';
          el.classList.remove('timer-expired-pulse');
        }
      });
    }

    function startPublicTimerInterval() {
      if (publicTimerInterval) clearInterval(publicTimerInterval);
      publicTimerInterval = setInterval(updatePublicTimers, 1000);
    }

    function updateTimestamp() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('last-updated').textContent =
        'Zuletzt aktualisiert: ' + h + ':' + m + ':' + s;
    }

    function setCurrentDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('current-date').textContent =
        now.toLocaleDateString('de-DE', options);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function renderAll() {
      renderMatches();
      renderLeaderboard();
      startPublicTimerInterval();
    }

    function onDataUpdate(newData) {
      data = newData;
      if (!data.settings) data.settings = { gameDurationMinutes: 10, standingsSport: 'Fußball' };
      if (!data.settings.standingsSport) data.settings.standingsSport = 'Fußball';
      if (!localStorage.getItem('sportfest-view-sport')) {
        selectedSport = data.settings.standingsSport;
      }
      renderAll();
      updateTimestamp();
    }

    document.getElementById('sport-view-switch').addEventListener('click', (e) => {
      const btn = e.target.closest('.sport-view-btn');
      if (!btn) return;
      selectedSport = btn.dataset.sport;
      localStorage.setItem('sportfest-view-sport', selectedSport);
      renderAll();
    });

    setCurrentDate();

    // ── Push Notifications ──

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    function isPreviewFrame() {
      return window.self !== window.top;
    }

    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function isStandaloneApp() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    }

    function canSubscribeToPush() {
      return window.isSecureContext
        && 'Notification' in window
        && 'serviceWorker' in navigator
        && 'PushManager' in window;
    }

    function shouldShowPushBar() {
      return !isPreviewFrame();
    }

    function getUnsupportedPushHint() {
      if (!window.isSecureContext) {
        return 'Push funktioniert nur über HTTPS (sichere Verbindung)';
      }
      if (isIOS() && !('PushManager' in window)) {
        return 'iOS: Teilen ↑ → „Zum Home-Bildschirm“ → Seite von dort öffnen';
      }
      if (isIOS() && !isStandaloneApp()) {
        return 'Tipp: In Safari öffnen oder zum Home-Bildschirm hinzufügen';
      }
      return 'Chrome oder Safari verwenden (nicht In-App-Browser wie WhatsApp)';
    }

    function updatePushToggleBar(active, hint) {
      const bar = document.getElementById('push-toggle-bar');
      const checkbox = document.getElementById('push-toggle-checkbox');
      const hintEl = document.getElementById('push-toggle-hint');
      const titleEl = document.getElementById('push-toggle-title');

      bar.style.display = 'block';
      document.body.classList.add('has-push-bar');
      checkbox.checked = !!active;
      bar.classList.toggle('is-active', !!active);
      bar.classList.toggle('is-unsupported', !!hint && !active && !canSubscribeToPush());

      if (active) {
        titleEl.textContent = '🔔 Benachrichtigungen aktiv';
        hintEl.textContent = 'Du erhältst Updates auch wenn die Seite geschlossen ist';
      } else if (Notification.permission === 'denied') {
        titleEl.textContent = '🔔 Benachrichtigungen';
        hintEl.textContent = 'In den Browser-Einstellungen für diese Seite erlauben';
      } else {
        titleEl.textContent = '🔔 Benachrichtigungen';
        hintEl.textContent = hint || 'Einmal aktivieren — funktioniert auch im Hintergrund';
      }
    }

    async function isPushSubscribed() {
      if (!canSubscribeToPush() || Notification.permission !== 'granted') return false;
      try {
        const reg = await navigator.serviceWorker.getRegistration('/');
        if (!reg) return false;
        const sub = await reg.pushManager.getSubscription();
        return !!sub;
      } catch {
        return false;
      }
    }

    async function unsubscribeFromPush() {
      const reg = await navigator.serviceWorker.getRegistration('/');
      if (!reg) return;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await fetch('/api/push/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint })
      }).catch(() => {});
      localStorage.removeItem('sportfest-push');
    }

    function showPushUI(state) {
      const banner = document.getElementById('push-banner');
      if (!shouldShowPushBar()) return;

      if (!canSubscribeToPush()) {
        banner.style.display = 'none';
        updatePushToggleBar(false, getUnsupportedPushHint());
        return;
      }

      if (state === 'subscribed') {
        banner.style.display = 'none';
        updatePushToggleBar(true);
      } else if (state === 'dismissed') {
        banner.style.display = 'none';
        updatePushToggleBar(false);
      } else {
        banner.style.display = 'none';
        updatePushToggleBar(false);
      }
    }

    async function ensurePushServiceWorker() {
      let reg = await navigator.serviceWorker.getRegistration('/');
      if (reg) {
        await reg.update();
      } else {
        reg = await navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' });
      }
      await navigator.serviceWorker.ready;
      return reg;
    }

    async function removeLocalPushSubscription(reg) {
      if (!reg) return;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      const endpoint = sub.endpoint;
      await fetch('/api/push/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint })
      }).catch(() => {});
      await sub.unsubscribe().catch(() => {});
    }

    function validateVapidPublicKey(publicKey) {
      const trimmed = String(publicKey || '').trim();
      if (!trimmed) throw new Error('Kein VAPID-Schlüssel vom Server');
      const bytes = urlBase64ToUint8Array(trimmed);
      if (bytes.length !== 65) {
        throw new Error('Ungültiger Push-Schlüssel — bitte Seite neu laden oder Admin kontaktieren');
      }
      return trimmed;
    }

    async function createPushSubscription(reg, publicKey) {
      await removeLocalPushSubscription(reg);
      try {
        return await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });
      } catch (err) {
        await removeLocalPushSubscription(reg);
        if (err?.name === 'AbortError' || /registration failed/i.test(String(err.message || err))) {
          throw new Error('Push-Dienst nicht erreichbar. Seite neu laden und erneut versuchen — oder anderen Browser (Chrome/Edge) nutzen.');
        }
        throw err;
      }
    }

    async function registerPushSubscription() {
      const reg = await ensurePushServiceWorker();

      const keyRes = await fetch('/api/push/vapid-key');
      if (!keyRes.ok) throw new Error('VAPID key konnte nicht geladen werden');
      const { publicKey } = await keyRes.json();
      const validKey = validateVapidPublicKey(publicKey);

      const sub = await createPushSubscription(reg, validKey);
      const subJson = sub.toJSON ? sub.toJSON() : JSON.parse(JSON.stringify(sub));
      if (!subJson.endpoint || !subJson.keys?.p256dh || !subJson.keys?.auth) {
        throw new Error('Ungültiges Push-Abo');
      }

      const res = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subJson)
      });

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.error || 'Server hat Abo abgelehnt');
      }

      return await res.json();
    }

    async function syncPushIfEnabled() {
      if (!canSubscribeToPush() || Notification.permission !== 'granted') return;
      try {
        const result = await registerPushSubscription();
        localStorage.setItem('sportfest-push', 'subscribed');
        showPushUI('subscribed');
        return result;
      } catch (err) {
        console.warn('Push sync fehlgeschlagen:', err);
        return null;
      }
    }

    async function subscribeToPush() {
      if (!canSubscribeToPush()) {
        alert('Push-Benachrichtigungen sind hier nicht verfügbar.\n\n' + getUnsupportedPushHint());
        return false;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          updatePushToggleBar(false);
          if (permission === 'denied') {
            alert('Benachrichtigungen wurden abgelehnt.\n\nBitte in den Einstellungen deines Browsers für diese Seite erlauben.');
          }
          return false;
        }

        const result = await registerPushSubscription();
        localStorage.setItem('sportfest-push', 'subscribed');
        showPushUI('subscribed');
        console.log('Push aktiv, Abonnenten gesamt:', result.subscribers);
        return true;
      } catch (err) {
        console.error('Push Fehler:', err);
        updatePushToggleBar(false);
        alert('Push konnte nicht aktiviert werden:\n' + (err.message || err));
        return false;
      }
    }

    async function initPushBanner() {
      if (!shouldShowPushBar()) return;

      if (!canSubscribeToPush()) {
        showPushUI('unsupported');
        return;
      }

      if (await isPushSubscribed() || Notification.permission === 'granted') {
        await syncPushIfEnabled();
        return;
      }

      const status = localStorage.getItem('sportfest-push');
      if (status === 'dismissed') {
        showPushUI('dismissed');
      } else {
        showPushUI('prompt');
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncPushIfEnabled();
      }
    });

    window.addEventListener('focus', () => {
      syncPushIfEnabled();
    });

    document.getElementById('push-toggle-checkbox').addEventListener('change', async (e) => {
      const checkbox = e.target;
      if (checkbox.checked) {
        checkbox.disabled = true;
        const ok = await subscribeToPush();
        checkbox.disabled = false;
        if (!ok) checkbox.checked = false;
      } else {
        try {
          await unsubscribeFromPush();
          showPushUI('dismissed');
        } catch (err) {
          console.error('Push deaktivieren fehlgeschlagen:', err);
          checkbox.checked = true;
        }
      }
    });

    document.getElementById('btn-enable-push').addEventListener('click', subscribeToPush);
    document.getElementById('btn-dismiss-push').addEventListener('click', () => {
      localStorage.setItem('sportfest-push', 'dismissed');
      showPushUI('dismissed');
    });

    initPushBanner();

    function getVisitorId() {
      let id = localStorage.getItem('sportfest-visitor-id');
      if (!id) {
        id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('sportfest-visitor-id', id);
      }
      return id;
    }

    window.addEventListener('resize', () => {
      renderAll();
    });

    fetch('/api/data')
      .then(res => res.json())
      .then(onDataUpdate)
      .catch(err => console.error('Failed to load data:', err));

    const socket = io();
    socket.on('connect', () => {
      socket.emit('visitor:present', { visitorId: getVisitorId(), page: 'public' });
    });
    socket.on('update', onDataUpdate);
  </script>
</body>
</html>
